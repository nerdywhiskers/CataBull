# -- Tracked companies --
# Companies whose career pages are checked directly.
# provider: auto, greenhouse, ashby, lever, workday, bamboohr, teamtailor, webfetch
# provider_config: optional provider-specific selectors/config
# For Greenhouse companies, add api: for a direct structured endpoint override.
#
# Health metadata (W4 — see docs/archive/SCAN_RELIABILITY.md):
# The dashboard's health check writes a `health:` block to each company
# describing the state of its careers URL. After AUTO_DISABLE_THRESHOLD
# (3) consecutive non-OK checks, `enabled: false` and `auto_disabled: true`
# are stamped automatically. Re-enabling the company through the UI
# clears the flag and resets the counter.
#
#   health:
#     last_check: 2026-04-30
#     last_status: not_found
#     last_error: "lever: HTTP 404"
#     consecutive_failures: 3
#     last_ok: 2026-04-15           # only set on the most recent success

