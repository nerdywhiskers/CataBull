<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerBot — Demo · Analytics</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="dashboard-css/theme.css" />
  <link rel="stylesheet" href="dashboard-css/layout.css" />
  <link rel="stylesheet" href="dashboard-css/components.css" />
  <link rel="stylesheet" href="dashboard-css/components-figma.css" />
  <link rel="stylesheet" href="dashboard-css/chatui.css" />
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
<div class="app">
  <div id="dashboard-container">

    <div id="dash-nav-mount"></div>
    <script src="nav.js"></script>

    <div class="dashboard-shell">
      <main class="main">
        <div class="view active">

          <div class="filter-tabs">
            <button class="filter-tab active" data-noop>Funnel</button>
            <button class="filter-tab" data-noop>Patterns</button>
            <button class="filter-tab" data-noop>Follow-ups</button>
            <button class="filter-tab" data-noop>Memory</button>
          </div>

          <section class="demo-metric-grid">
            <div class="demo-metric"><span class="demo-metric-label">Pending</span><span class="demo-metric-value">8</span><span class="demo-metric-trend">+3 this week</span></div>
            <div class="demo-metric"><span class="demo-metric-label">Evaluated</span><span class="demo-metric-value">3</span><span class="demo-metric-trend">avg fit 4.0</span></div>
            <div class="demo-metric"><span class="demo-metric-label">Applied</span><span class="demo-metric-value">2</span><span class="demo-metric-trend">25% conversion</span></div>
            <div class="demo-metric"><span class="demo-metric-label">Interview</span><span class="demo-metric-value">1</span><span class="demo-metric-trend">50% from applied</span></div>
            <div class="demo-metric"><span class="demo-metric-label">Offers</span><span class="demo-metric-value">0</span><span class="demo-metric-trend">in flight</span></div>
          </section>

          <section class="card" style="padding:18px;margin-bottom:16px">
            <header style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
              <h3 style="margin:0;color:var(--text);font-size:14px">Funnel</h3>
              <span style="font-size:11px;color:var(--subtext0)">last 30 days</span>
            </header>
            <div class="demo-funnel">
              <div class="demo-funnel-row"><span class="demo-funnel-label">Discovered</span><div class="demo-funnel-bar"><div class="demo-funnel-fill" style="width:100%">14</div></div></div>
              <div class="demo-funnel-row"><span class="demo-funnel-label">Evaluated</span><div class="demo-funnel-bar"><div class="demo-funnel-fill" style="width:36%">5</div></div></div>
              <div class="demo-funnel-row"><span class="demo-funnel-label">Applied</span><div class="demo-funnel-bar"><div class="demo-funnel-fill" style="width:21%">3</div></div></div>
              <div class="demo-funnel-row"><span class="demo-funnel-label">Interview</span><div class="demo-funnel-bar"><div class="demo-funnel-fill" style="width:14%">2</div></div></div>
              <div class="demo-funnel-row"><span class="demo-funnel-label">Offer</span><div class="demo-funnel-bar"><div class="demo-funnel-fill" style="width:0%">0</div></div></div>
            </div>
          </section>

          <section class="card" style="padding:18px">
            <header style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
              <h3 style="margin:0;color:var(--text);font-size:14px">Score distribution</h3>
              <span style="font-size:11px;color:var(--subtext0)">all evaluated roles</span>
            </header>
            <div class="demo-hist">
              <div class="demo-hist-bar"><div class="demo-hist-fill poor" style="height:8%"></div><span>1.0</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill poor" style="height:8%"></div><span>1.5</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill low" style="height:16%"></div><span>2.0</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill low" style="height:24%"></div><span>2.5</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill decent" style="height:32%"></div><span>3.0</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill decent" style="height:48%"></div><span>3.5</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill good" style="height:80%"></div><span>4.0</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill excellent" style="height:64%"></div><span>4.5</span></div>
              <div class="demo-hist-bar"><div class="demo-hist-fill excellent" style="height:24%"></div><span>5.0</span></div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>
</div>

<script src="chat-rail.js"></script>
<script src="noop.js"></script>
</body>
</html>
